name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Import Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports (API)
        run: python -c "import backend.api"
        env:
          SECRET_KEY: test-secret-key
          GMAIL_USER: test@test.com
          GMAIL_PASSWORD: test

      - name: Check imports (Dashboard)
        run: |
          cd dashboard
          python -c "import translations; import styles; import forecast"
        env:
          API_URL: http://localhost:8000

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t enervision-api:ci .

      - name: Build Dashboard image
        run: docker build -f Dockerfile.dashboard -t enervision-dashboard:ci .
